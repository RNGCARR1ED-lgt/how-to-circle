# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: store test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/
            build/test-results/

  # Launches a real Minecraft client with the mod under a virtual framebuffer and runs
  # src/gametest (GUI, circles, ovals, labels, large shapes, centre selection, no block changes).
  client_game_test:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: install virtual framebuffer and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: run client game tests
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-game-test-screenshots
          path: build/run/clientGameTest/screenshots
      - name: upload client logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-game-test-logs
          path: |
            build/run/clientGameTest/logs/
            build/run/clientGameTest/crash-reports/
